<script>
(function () {
  const p1 = document.getElementById('{{ first }}'), p2 = document.getElementById('{{ second }}');
  const bar = document.getElementById('strengthBar');
  const set = (k, ok) => { const li = document.querySelector(`[data-check="${k}"]`); if (li) li.classList.toggle('ok', ok); };
  function check() {
    const v = p1.value;
    let score = 0;
    if (v.length >= 8) score++;
    if (v.length >= 12) score++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if (/\d/.test(v) && /\D/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    const colors = ['var(--danger)', 'var(--danger)', 'var(--warning)', 'var(--warning)', 'var(--success)', 'var(--success)'];
    if (bar) { bar.style.setProperty('--w', (v ? Math.max(12, score * 20) : 0) + '%'); bar.style.setProperty('--c', colors[score]); }
    set('len', v.length >= 8);
    set('mix', v.length > 0 && !/^\d+$/.test(v));
    set('match', v.length > 0 && v === p2.value);
  }
  p1.addEventListener('input', check);
  p2.addEventListener('input', check);
})();
</script>
