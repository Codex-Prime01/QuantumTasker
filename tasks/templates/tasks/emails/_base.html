<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block subject %}Quantum Manager{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background:#F2F4F8; font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#18181B;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F4F8; padding:28px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background:#FFFFFF; border-radius:16px; overflow:hidden; border:1px solid #E5E7EE;">
      <tr><td style="background:#070D1F; padding:22px 28px;">
        <span style="color:#EAF0FF; font-size:17px; font-weight:700; letter-spacing:-0.2px;">Quantum Manager</span>
        <span style="color:#8DB6FF; font-size:13px; padding-left:8px;">Never forget again</span>
      </td></tr>
      <tr><td style="padding:30px 28px 10px; font-size:15px; line-height:1.6; color:#3F3F46;">
        {% block body %}{% endblock %}
      </td></tr>
      <tr><td style="padding:18px 28px 26px; font-size:12.5px; line-height:1.6; color:#8A8A90; border-top:1px solid #F0F0F2;">
        {% block footer %}This is an automatic email from Quantum Manager. Please don't reply.{% endblock %}
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
