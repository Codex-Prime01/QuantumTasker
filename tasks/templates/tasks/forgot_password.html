{% extends 'tasks/auth_base.html' %}
{% block title %}Forgot password · Quantum Manager{% endblock %}
{% block content %}
<h1 class="auth-title">Forgot your password?</h1>
<p class="auth-sub">Enter your email and we'll send you a link to set a new one.</p>
<form method="post" class="form">
  {% csrf_token %}
  <div class="field">
    <label class="label" for="email">Email</label>
    <input class="input" type="email" id="email" name="email" autocomplete="email" required autofocus>
  </div>
  <button class="btn btn-primary btn-lg btn-block" type="submit">Send reset link</button>
</form>
<p class="auth-foot"><a href="{% url 'login' %}">Back to log in</a></p>
{% endblock %}
