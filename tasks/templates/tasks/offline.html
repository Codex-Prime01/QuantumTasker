{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're offline · Quantum Manager</title>
  <style>
    :root { --bg: #070D1F; --surface: #0F1A3A; --border: #22336A; --text: #EAF0FF; --muted: #8E9BC3; --accent: #2B6CFF; }
    [data-theme="light"] { --bg: #F7F7F5; --surface: #FFFFFF; --border: #E5E5E2; --text: #18181B; --muted: #6B6B70; --accent: #2F54EB; }
    [data-theme="dark"] { --bg: #0A0A0A; --surface: #141414; --border: #262624; --text: #F5F5F2; --muted: #A3A3A0; --accent: #3A6DFF; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: var(--bg); color: var(--text); font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    .box { max-width: 380px; }
    .art { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 22px; display: flex; align-items: center; justify-content: center;
      background: var(--surface); border: 1px solid var(--border); color: var(--accent); }
    h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 22px; line-height: 1.5; }
    button { height: 46px; padding: 0 22px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
  <script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('qm-theme') || 'blue'); } catch (e) {}</script>
</head>
<body>
  <div class="box">
    <div class="art" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 4.2-2.6M10 5.2A15 15 0 0 1 22 8.8M5 12.5a10 10 0 0 1 5-2.5M16.5 11a10 10 0 0 1 2.5 1.5M8.5 16a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Quantum Manager needs a connection to load your tasks. Alarms you've already turned on will still reach this device once you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
