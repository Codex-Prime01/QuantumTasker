{% extends 'tasks/auth_base.html' %}
{% block title %}New verification link · Quantum Manager{% endblock %}
{% block content %}
<h1 class="auth-title">Send a new link</h1>
<p class="auth-sub">Enter the email you signed up with.</p>
<form method="post" class="form">
  {% csrf_token %}
  <div class="field">
    <label class="label" for="email">Email</label>
    <input class="input" type="email" id="email" name="email" value="{% if pending_email %}{{ pending_email }}{% elif user.is_authenticated %}{{ user.email }}{% endif %}" required autocomplete="email" autofocus>
  </div>
  <button class="btn btn-primary btn-lg btn-block" type="submit">Send verification email</button>
</form>
<p class="auth-foot"><a href="{% if user.is_authenticated %}{% url 'list' %}{% else %}{% url 'login' %}{% endif %}">{% if user.is_authenticated %}Back to tasks{% else %}Back to log in{% endif %}</a></p>
{% endblock %}
