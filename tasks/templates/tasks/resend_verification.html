{% extends 'tasks/base.html' %}

{% block title %}Resend Verification - Quantum Manager{% endblock %}

{% block content %}
<div class="verification-container">
    <div class="verification-card">
        <div class="verification-icon">🔄</div>
        <h1 class="verification-title">Resend Verification Email</h1>
        <p class="verification-text">
            Need a new verification link? Enter the email you signed up with and we'll send a fresh one.
        </p>
        
        <form method="POST" class="resend-form">
            {% csrf_token %}
            <input type="email" name="email" class="form-input" placeholder="you@example.com"
                   value="{{ pending_email }}" required autocomplete="email" style="margin-bottom: 1rem; width: 100%;">
            <button type="submit" class="btn-resend-large">
                <span>📧</span>
                <span>Send New Verification Email</span>
            </button>
        </form>
        
        <a href="{% url 'login' %}" class="back-link">← Back to Login</a>
    </div>
</div>
{% endblock %}
